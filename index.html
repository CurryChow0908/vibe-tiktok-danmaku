<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe Danmaku TikTok Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
        --glass: rgba(18, 18, 22, 0.32);
        --line: rgba(255, 255, 255, 0.18);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 60, 108, 0.16), transparent 32%),
          radial-gradient(circle at 82% 78%, rgba(0, 216, 255, 0.14), transparent 34%),
          #07070a;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .phone-wrap {
        width: min(417px, calc(100vw - 24px), calc((100vh - 24px) * 417 / 876));
        height: min(876px, calc(100vh - 24px), calc((100vw - 24px) * 876 / 417));
        position: relative;
        border-radius: 56px;
        padding: 12px;
        background: linear-gradient(145deg, #2b2d34, #08090d 48%, #343640);
        box-shadow:
          0 34px 120px rgba(0, 0, 0, 0.72),
          inset 0 0 0 1px rgba(255, 255, 255, 0.16);
      }

      .phone-wrap::before,
      .phone-wrap::after {
        content: "";
        position: absolute;
        left: -4px;
        width: 3px;
        border-radius: 999px;
        background: linear-gradient(#555a66, #17191f);
      }

      .phone-wrap::before {
        top: 132px;
        height: 64px;
      }

      .phone-wrap::after {
        top: 214px;
        height: 92px;
      }

      .power-key {
        position: absolute;
        right: -4px;
        top: 188px;
        width: 3px;
        height: 96px;
        border-radius: 999px;
        background: linear-gradient(#555a66, #17191f);
      }

      .screen {
        height: 100%;
        overflow: hidden;
        position: relative;
        border-radius: 44px;
        background: #000;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        touch-action: none;
        user-select: none;
      }

      .notch {
        position: absolute;
        top: 11px;
        left: 50%;
        z-index: 30;
        width: 126px;
        height: 37px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.92);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.42);
      }

      .feed {
        height: 100%;
        transform: translate3d(0, 0, 0);
        transition: transform 560ms cubic-bezier(0.2, 0.92, 0.1, 1);
      }

      .ui-feed {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        transform: translate3d(0, 0, 0);
        transition: transform 560ms cubic-bezier(0.2, 0.92, 0.1, 1);
      }

      .ui-card {
        position: relative;
        height: 100%;
      }

      .danmaku-form {
        pointer-events: auto;
      }

      .comment-trigger {
        pointer-events: auto;
      }

      .comment-sheet {
        position: absolute;
        inset: auto 0 0;
        z-index: 45;
        height: 62%;
        color: #15161a;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -22px 60px rgba(0, 0, 0, 0.42);
        transform: translateY(108%);
        transition: transform 360ms cubic-bezier(0.2, 0.92, 0.16, 1);
        overflow: hidden;
      }

      .comment-sheet.open {
        transform: translateY(0);
      }

      .comment-backdrop {
        position: absolute;
        inset: 0;
        z-index: 44;
        background: rgba(0, 0, 0, 0.22);
        opacity: 0;
        pointer-events: none;
        transition: opacity 260ms ease;
      }

      .comment-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }

      .comment-list {
        height: calc(100% - 106px);
        overflow: auto;
        padding: 12px 16px 88px;
      }

      .comment-avatar {
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: linear-gradient(135deg, #d7f0ff, #353846 58%, #ff8fb3);
      }

      .badge-icon {
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        margin-left: 4px;
        vertical-align: -3px;
      }

      .comment-name {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-weight: 850;
      }

      .comment-name.hot {
        color: #f04438;
        text-shadow: 0 0 10px rgba(240, 68, 56, .22);
      }

      .comment-name.beauty {
        color: #d946b8;
        text-shadow: 0 0 10px rgba(217, 70, 184, .2);
      }

      .comment-name.shop {
        color: #b7791f;
        text-shadow: 0 0 9px rgba(183, 121, 31, .2);
      }

      .comment-form {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        border-radius: 999px;
        background: #f1f1f4;
      }

      .video-card {
        height: 100%;
        position: relative;
        overflow: hidden;
        background: #050506;
      }

      .video-card::before {
        content: "";
        position: absolute;
        inset: 0;
        transform: none;
        background:
          var(--scene-tint, transparent),
          var(--scene);
        background-size: cover;
        background-position: var(--scene-position, center);
        filter: saturate(1.04);
      }

      .video-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to bottom, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.05) 22%, transparent 60%, rgba(0, 0, 0, 0.72)),
          linear-gradient(to right, rgba(0, 0, 0, 0.08), transparent 42%, rgba(0, 0, 0, 0.18));
      }

      .glass {
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: var(--glass);
        backdrop-filter: blur(18px) saturate(1.25);
        -webkit-backdrop-filter: blur(18px) saturate(1.25);
      }

      .status-bar {
        height: 42px;
        padding: 0 18px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
      }

      .status-right {
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .cellular {
        display: flex;
        align-items: end;
        gap: 2px;
        height: 13px;
      }

      .cellular i {
        width: 3px;
        border-radius: 2px;
        background: #fff;
      }

      .wifi-icon path {
        stroke: #fff;
        stroke-width: 2.4;
        stroke-linecap: round;
        fill: none;
      }

      .battery {
        position: relative;
        width: 27px;
        height: 13px;
        border: 1.8px solid #fff;
        border-radius: 4px;
      }

      .battery::before {
        content: "";
        position: absolute;
        inset: 2px 6px 2px 2px;
        border-radius: 2px;
        background: #fff;
      }

      .battery::after {
        content: "";
        position: absolute;
        right: -4px;
        top: 3.5px;
        width: 2px;
        height: 5px;
        border-radius: 0 2px 2px 0;
        background: rgba(255, 255, 255, 0.85);
      }

      .top-tabs {
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }

      .top-tabs .active::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -11px;
        width: 34px;
        height: 3px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #fff;
      }

      .icon-btn {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 999px;
        color: white;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.48));
      }

      .avatar {
        width: 52px;
        height: 52px;
        border: 2px solid #fff;
        border-radius: 999px;
        background:
          radial-gradient(circle at 52% 32%, #fff 0 8%, transparent 9%),
          radial-gradient(circle at 45% 36%, #1b1b21 0 24%, transparent 25%),
          conic-gradient(from 140deg, #fff, #e9efff, #0e0e13, #fff);
      }

      .follow-plus {
        position: absolute;
        left: 50%;
        bottom: -10px;
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #ff2d62;
        color: #fff;
        font-weight: 900;
        box-shadow: 0 4px 14px rgba(255, 45, 98, 0.5);
      }

      .record {
        position: relative;
        background:
          radial-gradient(circle, #d9d9df 0 12%, #20212a 13% 25%, #050506 26% 42%, #2f313b 43% 47%, #070708 48%);
        animation: spin 5s linear infinite;
      }

      .record::after {
        content: "";
        width: 19px;
        height: 19px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffcf5d, #ff4d8f, #00d8ff);
      }

      .desc {
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75);
      }

      .danmaku-toggle {
        pointer-events: auto;
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(18, 18, 22, 0.44);
        backdrop-filter: blur(18px) saturate(1.25);
        -webkit-backdrop-filter: blur(18px) saturate(1.25);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.34);
        color: #fff;
        font-size: 24px;
        font-weight: 950;
        line-height: 1;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.48);
        transition: opacity 160ms ease, transform 160ms ease, background 160ms ease;
      }

      .danmaku-toggle:active {
        transform: scale(0.94);
      }

      .danmaku-toggle.is-off {
        opacity: 0.54;
        background: rgba(18, 18, 22, 0.66);
      }

      .music-scroll {
        max-width: 248px;
        overflow: hidden;
        white-space: nowrap;
      }

      .music-scroll span {
        display: inline-block;
        padding-left: 100%;
        animation: marquee 8s linear infinite;
      }

      .bottom-nav {
        box-shadow: 0 -16px 44px rgba(0, 0, 0, 0.36);
      }

      .plus-box {
        width: 50px;
        height: 34px;
        border-radius: 12px;
        border: 2px solid #fff;
        box-shadow: -4px 0 #00e5ff, 4px 0 #ff2d62;
      }

      .danmaku-layer,
      .fx-layer {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      .fx-overlay {
        position: absolute;
        inset: 0;
        z-index: 11;
        pointer-events: none;
        opacity: 0;
      }

      .fx-overlay.hot {
        animation: bottomIgnite 1800ms cubic-bezier(0.16, 0.84, 0.24, 1);
      }

      .fx-overlay.beauty {
        animation: bloom 520ms ease-out;
      }

      .input-shell {
        transition: border-color 200ms ease, background 200ms ease;
      }

      .input-shell:focus-within {
        border-color: rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.13);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes marquee {
        to { transform: translateX(-100%); }
      }

      @keyframes bottomIgnite {
        0% { opacity: 0; background: linear-gradient(to top, rgba(255, 82, 40, 0), transparent 42%); }
        18% { opacity: 1; background: linear-gradient(to top, rgba(255, 82, 40, .18), transparent 48%); }
        70% { opacity: .92; background: linear-gradient(to top, rgba(255, 82, 40, .12), transparent 54%); }
        100% { opacity: 0; background: linear-gradient(to top, rgba(255, 82, 40, 0), transparent 60%); }
      }

      @keyframes bloom {
        0% { opacity: 0; background: rgba(255, 190, 154, 0); filter: blur(0); }
        28% { opacity: 1; background: rgba(255, 190, 154, 0.2); filter: blur(8px); }
        100% { opacity: 0; background: rgba(255, 190, 154, 0); filter: blur(0); }
      }

    </style>
  </head>

      function currentDanmakus() {
        if (!state.danmakuPools[state.index]) state.danmakuPools[state.index] = [];

        state.beautyFountainUntil = 0;

      function syncDanmakuToggle() {
        danmakuToggles.forEach((button) => {
          button.classList.toggle("is-off", !state.danmakuVisible);
          button.setAttribute("aria-pressed", String(state.danmakuVisible));

      function badgeSvg(type) {
        if (type === "hot") return `<span class="badge-icon" title="高燃徽章"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12.8 2.8c1.3 3.3-.6 4.7 1.4 7.1.8-1 1.2-2.2 1.2-3.5 3 2.3 4.5 5.3 4.2 8.4-.4 4-3.5 6.7-7.6 6.7-4.4 0-7.7-2.9-7.7-7.2 0-3.4 2.4-5.7 5-8.2.9-.9 1.9-1.9 3.5-3.3Z" fill="url(#fireBadge)"/><path d="M12.1 11.2c1.6 2-.2 2.9 1.1 4.5.5-.5.8-1.1 1-1.8 1.4 1.2 2 2.5 1.9 3.8-.2 2-1.8 3.3-4 3.3-2.1 0-3.8-1.4-3.8-3.5 0-1.8 1.4-3.2 3.8-6.3Z" fill="#fff2d9" opacity=".78"/><defs><linearGradient id="fireBadge" x1="6" y1="2" x2="18" y2="22"><stop stop-color="#ffd1bf"/><stop offset=".45" stop-color="#ff4939"/><stop offset="1" stop-color="#b91532"/></linearGradient></defs></svg></span>`;
        if (type === "beauty") return `<span class="badge-icon" title="心动徽章"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 20.6S4.2 16.1 4.2 9.9c0-3.2 2.4-5.1 5-5.1 1.6 0 2.7.7 2.8 1.6.3-.9 1.4-1.6 2.8-1.6 2.6 0 5 1.9 5 5.1 0 6.2-7.8 10.7-7.8 10.7Z" fill="url(#heartBadge)"/><defs><linearGradient id="heartBadge" x1="5" y1="5" x2="19" y2="20"><stop stop-color="#ff9dde"/><stop offset=".5" stop-color="#ff5dbb"/><stop offset="1" stop-color="#b689ff"/></linearGradient></defs></svg></span>`;
        if (type === "shop") return `<span class="badge-icon" title="种草徽章"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="8.5" fill="url(#coinBadge)"/><circle cx="12" cy="12" r="5.2" fill="none" stroke="rgba(109,70,8,.35)" stroke-width="1.5"/><path d="M12 7.8v8.4M9.2 10.2c.5-1 1.4-1.5 2.8-1.5 1.6 0 2.6.7 2.6 1.8 0 2.8-5.4 1.4-5.4 4 0 1.2 1.1 1.9 2.8 1.9 1.5 0 2.5-.5 3.1-1.6" stroke="#7a4c05" stroke-width="1.4" stroke-linecap="round"/><defs><linearGradient id="coinBadge" x1="5" y1="4" x2="19" y2="20"><stop stop-color="#fff0a8"/><stop offset=".48" stop-color="#f6bd35"/><stop offset="1" stop-color="#a7670b"/></linearGradient></defs></svg></span>`;
        return "";
      }

      function openComments() {
        renderComments();
        commentSheet.classList.add("open");
        commentBackdrop.classList.add("open");
        commentSheet.setAttribute("aria-hidden", "false");
      }

      function closeCommentSheet() {
        commentSheet.classList.remove("open");
        commentBackdrop.classList.remove("open");
        commentSheet.setAttribute("aria-hidden", "true");
      }

      function renderComment(comment) {
        const article = document.createElement("article");
        article.className = "mb-5 flex gap-3";
        const badgeClass = comment.badge || "";
        article.innerHTML = `<div class="comment-avatar"></div><div class="min-w-0 flex-1"><div class="text-sm text-black/42"><span class="comment-name ${badgeClass}"></span></div><p class="mt-1 text-[15px] leading-snug text-black/88"></p><div class="mt-2 text-xs text-black/38">${comment.time} · 回复</div></div><span class="text-xl text-black/36">♡</span>`;
        const name = article.querySelector(".comment-name");
        name.textContent = comment.name;
        name.insertAdjacentHTML("beforeend", badgeSvg(comment.badge));
        article.querySelector("p").textContent = comment.text;
        return article;
      }

      function renderComments() {
        commentList.replaceChildren(...commentPools[state.index].map(renderComment));
      }

      function addUserComment(text) {
        commentPools[state.index].unshift({ name: "我", text, time: "刚刚", badge: state.userBadge });
        renderComments();
      }

      function sendViewerDanmaku(videoIndex = state.index) {
        const pool = demoPools[videoIndex];
        const next = demoIndexByVideo[videoIndex] % pool.length;
        sendDanmaku(pool[next], { source: "viewer", videoIndex });
        demoIndexByVideo[videoIndex]++;
      }

      function resizeCanvas() {
        const rect = screen.getBoundingClientRect();
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        for (const canvas of [dCanvas, fCanvas]) {
          canvas.width = Math.floor(rect.width * state.dpr);
          canvas.height = Math.floor(rect.height * state.dpr);
          canvas.style.width = rect.width + "px";
          canvas.style.height = rect.height + "px";
        }
        dCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        fCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      }

      function detectVibe(text) {
        const normalized = text.toLowerCase();
        return vibeMap.find((vibe) => vibe.keys.some((key) => normalized.includes(key.toLowerCase())))?.type || "normal";
      }

      function sendDanmaku(text, options = {}) {
        const value = String(text || "").trim();
        if (!value) return;
        const source = options.source || "self";
        const isSelf = source === "self";
        const videoIndex = Number.isInteger(options.videoIndex) ? options.videoIndex : state.index;
        if (!state.danmakuPools[videoIndex]) state.danmakuPools[videoIndex] = [];
        const rect = screen.getBoundingClientRect();
        const vibe = detectVibe(value);
        const laneHeight = 34;
        const top = 112;
        const bottom = Math.max(top + laneHeight, rect.height - 214);
        const lanes = Math.max(3, Math.floor((bottom - top) / laneHeight));
        const lane = Math.floor(Math.random() * lanes);
        const y = top + lane * laneHeight + Math.random() * 11;

        state.danmakuPools[videoIndex].push({
          text: value,
          vibe,
          x: rect.width + 28,
          y,
          speed: 90 + Math.random() * 42 + value.length * 2,
          life: 0,
          wobble: Math.random() * Math.PI * 2,
          floatAmp: 1.8 + Math.random() * 2.8,
          floatSpeed: 2.4 + Math.random() * 1.8,
          self: isSelf
        });

        if (isSelf && vibe !== "normal") {
          state.userBadge = vibe;
          triggerFullScreen(vibe);
        }
      }

      window.sendDanmaku = sendDanmaku;

      function triggerFullScreen(vibe) {
        fxOverlay.className = "fx-overlay";
        void fxOverlay.offsetWidth;
        if (vibe === "hot") {
          fxOverlay.className = "fx-overlay hot";
          state.flameUntil = performance.now() + 1800;
          state.flameCarry = 0;
          for (let i = 0; i < 30; i++) spawnFlame();
          for (let i = 0; i < 22; i++) spawnParticle("ember", Math.random() * screen.clientWidth, screen.clientHeight * 0.93 + Math.random() * 38, -Math.PI / 2 + (Math.random() - 0.5) * 0.9, 42 + Math.random() * 96);
        }
        if (vibe === "beauty") {
          fxOverlay.className = "fx-overlay beauty";
          state.beautyFountainUntil = performance.now() + 1800;
          state.beautyFountainCarry = 0;
          for (let i = 0; i < 14; i++) spawnBubble(true);
        }
        if (vibe === "shop") {
          fxOverlay.className = "fx-overlay";
          for (let i = 0; i < 28; i++) spawnCoin(Math.random() * screen.clientWidth, -Math.random() * 220, true);
        }
      }

      function spawnParticle(kind, x, y, angle, speed) {
        state.particles.push({
          kind,
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: kind === "nitro" ? 1.6 + Math.random() * 2.8 : 1.2 + Math.random() * 3.8,
          life: kind === "spark" ? 0.55 : 0.38,
          age: 0,
          hue: Math.random()
        });
      }

      function spawnFlame() {
        const w = screen.clientWidth;
        const h = screen.clientHeight;
        const depth = Math.random();
        const baseX = Math.random() * w;
        state.flames.push({
          x: baseX,
          y: h - 92 + Math.random() * 52,
          vx: (Math.random() - 0.5) * (18 + depth * 18),
          vy: -84 - Math.random() * 112 - depth * 52,
          w: 18 + Math.random() * 34 + depth * 20,
          h: 54 + Math.random() * 86 + depth * 46,
          age: 0,
          life: 0.72 + Math.random() * 0.54,
          sway: 2 + Math.random() * 4,
          phase: Math.random() * Math.PI * 2,
          hue: Math.random()
        });
      }

      function spawnBubble(full = false) {
        const w = screen.clientWidth;
        const h = screen.clientHeight;
        const depth = Math.random();
        state.bubbles.push({
          x: Math.random() * w,
          y: full ? h - 36 + Math.random() * 88 : h - 82 + Math.random() * 34,
          vx: -14 + Math.random() * 28,
          vy: -58 - Math.random() * 104 - depth * 42,
          r: 6 + Math.random() * 26 + depth * 10,
          age: 0,
          life: 2.4 + Math.random() * 1.8,
          blur: 0.5 + Math.random() * 8 + depth * 5,
          sway: 1.2 + Math.random() * 2.7,
          phase: Math.random() * Math.PI * 2,
          depth,
          full
        });
      }

      function spawnCoin(x, y, shower = false) {
        state.coins.push({
          x,
          y,
          vx: (Math.random() - 0.5) * (shower ? 78 : 36),
          vy: shower ? 90 + Math.random() * 170 : 58 + Math.random() * 70,
          r: shower ? 7 + Math.random() * 8 : 5 + Math.random() * 5,
          rot: Math.random() * Math.PI,
          spin: -6 + Math.random() * 12,
          age: 0,
          life: shower ? 2.2 : 0.62,
          bounce: 0
        });
      }

      function drawHeart(ctx, x, y, size, alpha, blur) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(size / 18, size / 18);
        ctx.shadowColor = `rgba(255, 94, 214, ${alpha})`;
        ctx.shadowBlur = 12 + blur;
        ctx.globalAlpha = alpha;
        const gradient = ctx.createLinearGradient(-10, -10, 10, 12);
        gradient.addColorStop(0, "rgba(255, 166, 231, 0.82)");
        gradient.addColorStop(0.55, "rgba(135, 214, 255, 0.56)");
        gradient.addColorStop(1, "rgba(255, 255, 255, 0.42)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(0, 8);
        ctx.bezierCurveTo(-13, 0, -10, -10, -3, -7);
        ctx.bezierCurveTo(0, -12, 10, -10, 10, -2);
        ctx.bezierCurveTo(10, 4, 3, 7, 0, 8);
        ctx.fill();
        ctx.restore();
      }

      function drawCoin(ctx, coin) {
        ctx.save();
        ctx.translate(coin.x, coin.y);
        ctx.rotate(coin.rot);
        const sx = 0.42 + Math.abs(Math.cos(coin.rot)) * 0.58;
        ctx.scale(sx, 1);
        const g = ctx.createRadialGradient(-coin.r * 0.3, -coin.r * 0.35, 1, 0, 0, coin.r);
        g.addColorStop(0, "#fff5b8");
        g.addColorStop(0.42, "#ffd55a");
        g.addColorStop(1, "#a86a06");
        ctx.fillStyle = g;
        ctx.shadowColor = "rgba(255, 205, 52, 0.8)";
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.ellipse(0, 0, coin.r, coin.r * 0.9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "rgba(255,255,255,.45)";
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, coin.r * 0.48, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(128,74,0,.34)";
        ctx.stroke();
        ctx.restore();
      }

      function drawWavyText(ctx, text, x, y, fillStyle, options = {}) {
        const chars = Array.from(text);
        let cursor = x;
        const amp = options.amp || 4;
        const stagger = options.stagger || 0.72;
        const phase = options.phase || 0;
        for (let i = 0; i < chars.length; i++) {
          const char = chars[i];
          const charY = y + Math.sin(phase + i * stagger) * amp + Math.sin(phase * 0.55 + i * 1.23) * (amp * 0.28);
          ctx.fillStyle = typeof fillStyle === "function" ? fillStyle(cursor, charY, char, i) : fillStyle;
          ctx.fillText(char, cursor, charY);
          cursor += ctx.measureText(char).width;
        }
      }

      function drawFlameBed(ctx, text, x, y, width, phase, amp) {
        const chars = Array.from(text);
        let cursor = x;
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.filter = "blur(0.35px)";
        for (let i = 0; i < chars.length; i++) {
          const char = chars[i];
          const charWidth = ctx.measureText(char).width;
          const center = cursor + charWidth * 0.5;
          const lift = Math.sin(phase * 0.95 + i * 1.18) * amp;
          const flameH = 8 + Math.sin(phase + i * 0.72) * 2.5;
          const flameW = Math.max(8, charWidth * 0.86);
          const g = ctx.createLinearGradient(center, y + 9, center, y - flameH);
          g.addColorStop(0, "rgba(255, 36, 42, 0)");
          g.addColorStop(0.34, "rgba(255, 53, 48, 0.18)");
          g.addColorStop(0.72, "rgba(255, 118, 83, 0.28)");
          g.addColorStop(1, "rgba(255, 214, 188, 0.06)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(center - flameW * 0.52, y + 9);
          ctx.bezierCurveTo(center - flameW * 0.38, y + 2, center - flameW * 0.18, y - flameH * 0.32 + lift, center - flameW * 0.05, y - flameH);
          ctx.bezierCurveTo(center + flameW * 0.08, y - flameH * 0.35, center + flameW * 0.38, y + 1, center + flameW * 0.52, y + 9);
          ctx.closePath();
          ctx.fill();
          cursor += charWidth;
        }
        const glow = ctx.createRadialGradient(x + width * 0.5, y + 5, 0, x + width * 0.5, y + 5, Math.max(48, width * 0.62));
        glow.addColorStop(0, "rgba(255, 58, 50, .14)");
        glow.addColorStop(1, "rgba(255, 58, 50, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(x - 20, y - 18, width + 40, 36);
        ctx.restore();
      }

      function drawSelfFrame(ctx, x, y, width, height, intensity = 1) {
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = 0.5 * intensity;
        ctx.lineWidth = 1.7;
        ctx.shadowColor = "rgba(255, 255, 255, .48)";
        ctx.shadowBlur = 6;
        ctx.strokeStyle = "rgba(255, 255, 255, .72)";
        ctx.fillStyle = "rgba(255, 255, 255, .045)";
        const padX = 8;
        const padY = 5;
        const radius = 9;
        ctx.beginPath();
        ctx.roundRect(x - padX, y - height / 2 - padY, width + padX * 2, height + padY * 2, radius);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawDanmaku(item, dt) {
        item.life += dt;
        item.x -= item.speed * dt;
        const pulse = Math.sin(item.life * 7 + item.wobble);
        const floatY = Math.sin(item.life * item.floatSpeed + item.wobble) * item.floatAmp;
        const fontSize = item.vibe === "normal" ? 17 : 20;

        dCtx.save();
        dCtx.font = `900 ${fontSize}px ui-sans-serif, system-ui`;
        dCtx.textBaseline = "middle";
        dCtx.lineJoin = "round";

        if (item.vibe === "hot") {
          const width = dCtx.measureText(item.text).width;
          const y = item.y;
          const lengthEase = Math.max(0, Math.min(1, (Array.from(item.text).length - 3) / 9));
          const phase = item.life * item.floatSpeed * (1.8 - lengthEase * 0.85) + item.wobble;
          const waveAmp = (item.self ? item.floatAmp + 1 : item.floatAmp) * (1 - lengthEase * 0.48);
          const waveStagger = 0.78 - lengthEase * 0.22;
          const g = dCtx.createLinearGradient(item.x, y - 16, item.x + width, y + 16);
          g.addColorStop(0, "#ffd0c6");
          g.addColorStop(0.32, "#ff3b35");
          g.addColorStop(0.62, "#ff7a45");
          g.addColorStop(0.82, "#ffe2d8");
          g.addColorStop(1, "#c1122f");
          dCtx.shadowColor = "rgba(255, 55, 48, 0.72)";
          drawFlameBed(dCtx, item.text, item.x, y + 9, width, phase, waveAmp);
          dCtx.shadowBlur = item.self ? 20 : 13;
          drawWavyText(dCtx, item.text, item.x, y, "rgba(255, 65, 55, .22)", { amp: waveAmp + 0.7, phase, stagger: waveStagger });
          dCtx.shadowBlur = item.self ? 11 : 7;
          drawWavyText(dCtx, item.text, item.x, y, g, { amp: waveAmp, phase, stagger: waveStagger });
          dCtx.globalCompositeOperation = "screen";
          drawWavyText(dCtx, item.text, item.x - 1, y - 1, "rgba(255, 224, 218, .32)", { amp: waveAmp * 0.72, phase: phase + 0.18, stagger: waveStagger });
          if (item.self) drawSelfFrame(dCtx, item.x, y, width, fontSize + waveAmp * 2, 0.92);
        } else if (item.vibe === "beauty") {
          const width = dCtx.measureText(item.text).width;
          const y = item.y + floatY * 0.55;
          const g = dCtx.createLinearGradient(item.x, y - 12, item.x + width, y + 12);
          g.addColorStop(0, "#ff82da");
          g.addColorStop(0.48, "#b999ff");
          g.addColorStop(1, "#65e8ff");
          dCtx.shadowColor = "rgba(174, 107, 255, .9)";
          dCtx.shadowBlur = 20;
          dCtx.filter = "blur(.25px)";
          dCtx.fillStyle = g;
          dCtx.fillText(item.text, item.x, y);
          if (item.self) drawSelfFrame(dCtx, item.x, y, width, fontSize, 0.78);
          const beautyTrailChance = item.self ? 0.09 : 0.045;
          if (Math.random() < beautyTrailChance) {
            state.bubbles.push({
              x: item.x + width + 8,
              y: y + (Math.random() - 0.5) * 10,
              vx: -10 + Math.random() * 14,
              vy: -34 - Math.random() * 34,
              r: 7 + Math.random() * 8,
              age: 0,
              life: 1.2 + Math.random() * 0.8,
              blur: 0.5 + Math.random() * 2.5,
              sway: 1.8 + Math.random() * 2.4,
              phase: Math.random() * Math.PI * 2,
              depth: 0.72 + Math.random() * 0.28
            });
          }
        } else if (item.vibe === "shop") {
          const width = dCtx.measureText(item.text).width;
          const y = item.y + floatY * 0.35;
          const g = dCtx.createLinearGradient(item.x, y - 12, item.x + width, y + 12);
          g.addColorStop(0, "#8f5d22");
          g.addColorStop(0.2, "#f5d88f");
          g.addColorStop(0.48, "#d99a35");
          g.addColorStop(0.76, "#fff1c6");
          g.addColorStop(1, "#ad6f2b");
          dCtx.shadowColor = "rgba(224, 154, 55, .68)";
          dCtx.shadowBlur = item.self ? 18 : 11;
          dCtx.fillStyle = "rgba(218, 148, 55, .22)";
          dCtx.fillText(item.text, item.x, y);
          dCtx.shadowBlur = item.self ? 10 : 6;
          dCtx.fillStyle = g;
          dCtx.fillText(item.text, item.x, y);
          const shineX = item.x + ((item.life * 145) % (width + 90)) - 45;
          dCtx.save();
          dCtx.globalAlpha = item.self ? 0.58 : 0.36;
          dCtx.globalCompositeOperation = "screen";
          const shine = dCtx.createLinearGradient(shineX - 18, y + 18, shineX + 20, y - 18);
          shine.addColorStop(0, "rgba(255,255,255,0)");
          shine.addColorStop(0.5, "rgba(255,255,255,.55)");
          shine.addColorStop(1, "rgba(255,255,255,0)");
          dCtx.fillStyle = shine;
          dCtx.font = `900 ${fontSize}px ui-sans-serif, system-ui`;
          dCtx.fillText(item.text, item.x, y);
          dCtx.restore();
          if (item.self) drawSelfFrame(dCtx, item.x, y, width, fontSize, 0.8);
          const shopTrailChance = item.self ? 0.07 : 0.018;
          if (Math.random() < shopTrailChance) spawnCoin(item.x + width + 8, y - 4, false);
          if (Math.random() < shopTrailChance * 0.9) spawnParticle("star", item.x + width, y, Math.PI * 0.5 + Math.random() * 0.4, 18 + Math.random() * 26);
        } else {
          dCtx.shadowColor = "rgba(0,0,0,.55)";
          dCtx.shadowBlur = 8;
          dCtx.fillStyle = "rgba(255,255,255,.94)";
          dCtx.fillText(item.text, item.x, item.y);
          if (item.self) drawSelfFrame(dCtx, item.x, item.y, dCtx.measureText(item.text).width, fontSize, 0.72);
        }
        dCtx.restore();

        return item.x + dCtx.measureText(item.text).width > -40;
      }

      function drawParticles(dt) {
        state.particles = state.particles.filter((p) => {
          p.age += dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.985;
          p.vy *= 0.985;
          const alpha = Math.max(0, 1 - p.age / p.life);
          fCtx.save();
          fCtx.globalAlpha = alpha;
          if (p.kind === "star") {
            fCtx.translate(p.x, p.y);
            fCtx.rotate(p.age * 8);
            fCtx.fillStyle = "#ffd84d";
            fCtx.shadowColor = "#ffd84d";
            fCtx.shadowBlur = 10;
            fCtx.beginPath();
            for (let i = 0; i < 10; i++) {
              const r = i % 2 ? p.r * 0.45 : p.r;
              const a = (i / 10) * Math.PI * 2;
              fCtx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            }
            fCtx.closePath();
            fCtx.fill();
          } else {
            const g = fCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
            if (p.kind === "nitro" || p.kind === "flare" || p.kind === "ember") {
              g.addColorStop(0, "#fff1ea");
              g.addColorStop(0.42, p.kind === "ember" ? "rgba(255, 125, 62, .72)" : "#ff4b38");
              g.addColorStop(1, "rgba(255, 35, 28, 0)");
            } else {
              g.addColorStop(0, "#fff6a8");
              g.addColorStop(0.5, "#ffd64a");
              g.addColorStop(1, "rgba(255, 196, 0, 0)");
            }
            fCtx.fillStyle = g;
            fCtx.beginPath();
            fCtx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
            fCtx.fill();
          }
          fCtx.restore();
          return p.age < p.life;
        });
      }

      function drawFlames(dt) {
        if (performance.now() < state.flameUntil) {
          state.flameCarry += dt * 36;
          while (state.flameCarry >= 1) {
            spawnFlame();
            state.flameCarry--;
          }
        }
        state.flames = state.flames.filter((flame) => {
          flame.age += dt;
          flame.x += flame.vx * dt + Math.sin(flame.age * flame.sway + flame.phase) * 0.9;
          flame.y += flame.vy * dt;
          flame.vy *= 0.985;
          const t = flame.age / flame.life;
          const alpha = Math.max(0, 1 - t);
          const stretch = 1 + t * 0.34;
          const shrink = 1 - t * 0.38;
          fCtx.save();
          fCtx.globalCompositeOperation = "screen";
          fCtx.globalAlpha = alpha * 0.88;
          fCtx.translate(flame.x, flame.y);
          fCtx.rotate(Math.sin(flame.age * 5 + flame.phase) * 0.16);
          fCtx.scale(shrink, stretch);
          const outer = fCtx.createRadialGradient(0, flame.h * 0.32, 0, 0, 0, flame.h * 0.82);
          outer.addColorStop(0, "rgba(255, 236, 185, .92)");
          outer.addColorStop(0.24, "rgba(255, 160, 63, .78)");
          outer.addColorStop(0.58, "rgba(255, 56, 42, .48)");
          outer.addColorStop(1, "rgba(151, 18, 30, 0)");
          fCtx.fillStyle = outer;
          fCtx.shadowColor = "rgba(255, 88, 42, .42)";
          fCtx.shadowBlur = 14;
          fCtx.beginPath();
          fCtx.moveTo(0, -flame.h * 0.72);
          fCtx.bezierCurveTo(-flame.w * 0.55, -flame.h * 0.22, -flame.w * 0.46, flame.h * 0.34, 0, flame.h * 0.5);
          fCtx.bezierCurveTo(flame.w * 0.52, flame.h * 0.22, flame.w * 0.42, -flame.h * 0.28, 0, -flame.h * 0.72);
          fCtx.fill();
          fCtx.globalAlpha = alpha * 0.55;
          fCtx.scale(0.48, 0.68);
          const inner = fCtx.createRadialGradient(0, flame.h * 0.1, 0, 0, 0, flame.h * 0.5);
          inner.addColorStop(0, "rgba(255, 255, 226, .95)");
          inner.addColorStop(0.38, "rgba(255, 205, 91, .72)");
          inner.addColorStop(1, "rgba(255, 128, 45, 0)");
          fCtx.fillStyle = inner;
          fCtx.beginPath();
          fCtx.moveTo(0, -flame.h * 0.52);
          fCtx.bezierCurveTo(-flame.w * 0.34, -flame.h * 0.1, -flame.w * 0.18, flame.h * 0.28, 0, flame.h * 0.42);
          fCtx.bezierCurveTo(flame.w * 0.28, flame.h * 0.14, flame.w * 0.22, -flame.h * 0.16, 0, -flame.h * 0.52);
          fCtx.fill();
          fCtx.restore();
          return flame.age < flame.life && flame.y > screen.clientHeight * 0.38;
        });
      }

      function drawBubbles(dt) {
        if (performance.now() < state.beautyFountainUntil) {
          state.beautyFountainCarry += dt * 22;
          while (state.beautyFountainCarry >= 1) {
            spawnBubble(true);
            state.beautyFountainCarry--;
          }
        }
        state.bubbles = state.bubbles.filter((b) => {
          b.age += dt;
          b.x += b.vx * dt + Math.sin(b.age * b.sway + b.phase) * (0.35 + b.depth * 0.42);
          b.y += b.vy * dt;
          const alpha = Math.max(0, 1 - b.age / b.life);
          const bubbleAlpha = b.full ? alpha * (0.64 + b.depth * 0.42) : alpha * (0.42 + b.depth * 0.36);
          drawHeart(fCtx, b.x, b.y, b.r, Math.min(0.96, bubbleAlpha), b.full ? b.blur * 0.72 : b.blur);
          return b.age < b.life && b.y > -90;
        });
      }

      function drawCoins(dt) {
        const floor = screen.clientHeight - 70;
        state.coins = state.coins.filter((coin) => {
          coin.age += dt;
          coin.x += coin.vx * dt;
          coin.y += coin.vy * dt;
          coin.vy += 260 * dt;
          coin.rot += coin.spin * dt;
          if (coin.y + coin.r > floor && coin.bounce < 1) {
            coin.y = floor - coin.r;
            coin.vy *= -0.34;
            coin.vx *= 0.72;
            coin.bounce++;
          }
          fCtx.globalAlpha = Math.max(0, 1 - coin.age / coin.life);
          drawCoin(fCtx, coin);
          fCtx.globalAlpha = 1;
          return coin.age < coin.life;
        });
      }

      function animate(now) {
        const dt = Math.min(0.033, (now - state.last) / 1000);
        state.last = now;
        dCtx.clearRect(0, 0, dCanvas.width, dCanvas.height);
        fCtx.clearRect(0, 0, fCanvas.width, fCanvas.height);
        if (state.danmakuVisible) {
          state.danmakuPools[state.index] = currentDanmakus().filter((item) => drawDanmaku(item, dt));
        }
        drawFlames(dt);
        drawParticles(dt);
        drawBubbles(dt);
        drawCoins(dt);
        requestAnimationFrame(animate);
      }

      function updateSlide(animate = true) {
        const transition = animate ? "transform 560ms cubic-bezier(0.2, 0.92, 0.1, 1)" : "none";
        const transform = `translate3d(0, ${-state.index * screen.clientHeight}px, 0)`;
        feed.style.transition = transition;
        uiFeed.style.transition = transition;
        feed.style.transform = transform;
        uiFeed.style.transform = transform;
        clearTransientEffects();
        if (commentSheet.classList.contains("open")) renderComments();
        if (animate && currentDanmakus().length < 3) {
          setTimeout(() => sendViewerDanmaku(state.index), 180);
          setTimeout(() => sendViewerDanmaku(state.index), 520);
        }
      }

      function startDrag(y) {
        state.dragging = true;
        state.startY = y;
        state.currentY = y;
        feed.style.transition = "none";
        uiFeed.style.transition = "none";
      }

      function moveDrag(y) {
        if (!state.dragging) return;
        state.currentY = y;
        const delta = y - state.startY;
        const transform = `translate3d(0, ${-state.index * screen.clientHeight + delta}px, 0)`;
        feed.style.transform = transform;
        uiFeed.style.transform = transform;
      }

      function endDrag() {
        if (!state.dragging) return;
        const delta = state.currentY - state.startY;
        const threshold = screen.clientHeight * 0.12;
        if (delta < -threshold && state.index < videos.length - 1) state.index++;
        if (delta > threshold && state.index > 0) state.index--;
        state.dragging = false;
        updateSlide(true);
      }

      screen.addEventListener("pointerdown", (event) => {
        if (event.target.closest("input, button")) return;
        screen.setPointerCapture(event.pointerId);
        startDrag(event.clientY);
      });
      screen.addEventListener("pointermove", (event) => moveDrag(event.clientY));
      screen.addEventListener("pointerup", endDrag);
      screen.addEventListener("pointercancel", endDrag);
      screen.addEventListener("wheel", (event) => {
        if (Math.abs(event.deltaY) < 18) return;
        state.index = Math.max(0, Math.min(videos.length - 1, state.index + Math.sign(event.deltaY)));
        updateSlide(true);
      }, { passive: true });

      forms.forEach((form) => {
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const input = form.querySelector("input");
          sendDanmaku(input.value, { source: "self", videoIndex: state.index });
          input.value = "";
        });
      });

      danmakuToggles.forEach((button) => {
        button.addEventListener("click", () => {
          state.danmakuVisible = !state.danmakuVisible;
          syncDanmakuToggle();
        });
      });

      commentTriggers.forEach((button) => button.addEventListener("click", openComments));
      closeComments.addEventListener("click", closeCommentSheet);
      commentBackdrop.addEventListener("click", closeCommentSheet);

      commentForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const value = commentInput.value.trim();
        if (!value) return;
        addUserComment(value);
        commentInput.value = "";
      });

      window.addEventListener("resize", () => {
        resizeCanvas();
        updateSlide(false);
      });

      resizeCanvas();
      updateSlide(false);
      syncDanmakuToggle();
      requestAnimationFrame(animate);

      const demoIndexByVideo = videos.map(() => 0);
      setInterval(() => {
        sendViewerDanmaku(state.index);
        if (Math.random() < 0.35) setTimeout(() => sendViewerDanmaku(state.index), 420);
      }, 1500);
    </script>
  </body>
</html>
